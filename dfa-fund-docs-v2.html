function Pill({ color, children, small }) {
  return <span style={{ background:`${color}20`, border:`1px solid ${color}50`, borderRadius:20, padding:small?"2px 8px":"3px 11px", fontSize:small?10:11, color, fontWeight:600, whiteSpace:"nowrap" }}>{children}</span>;
}
function DimBtn({ label, active, color, onClick }) {
  return <button onClick={onClick} style={{ background:active?`${color}20`:"transparent", border:`1px solid ${active?color:C.border}`, borderRadius:7, padding:"7px 13px", fontSize:12, fontWeight:active?700:400, color:active?C.white:C.muted, cursor:"pointer", transition:"all 0.15s", whiteSpace:"nowrap" }}>{label}</button>;
}
function AccordionList({ items, accentColor }) {
  const [open, setOpen] = useState(null);
  return (
    <div style={{ display:"flex", flexDirection:"column", gap:5 }}>
      {items.map((item,i) => (
        <div key={i}>
          <button onClick={() => setOpen(open===i?null:i)} style={{ width:"100%", background:open===i?`${accentColor||C.accent}18`:"#0D1320", border:`1px solid ${open===i?accentColor||C.accent:C.border}`, borderRadius:7, padding:"8px 12px", textAlign:"left", display:"flex", justifyContent:"space-between", alignItems:"center", cursor:"pointer", transition:"all 0.15s" }}>
            <span style={{ fontSize:12, fontWeight:600, color:open===i?C.white:C.text }}>{item.s}</span>
            <span style={{ fontSize:10, color:C.muted, flexShrink:0, marginLeft:8 }}>{open===i?"▲":"▼"}</span>
          </button>
          {open===i && (
            <div style={{ background:"#0D1320", borderLeft:`3px solid ${accentColor||C.accent}`, borderRadius:"0 0 7px 7px", padding:"10px 13px", marginTop:1 }}>
              <p style={{ fontSize:12, color:C.dim, lineHeight:1.7 }}>{item.d}</p>
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

        {section==="size" && (
          <div>
            <div style={{ fontSize:13, fontWeight:700, color:fund.color, fontFamily:"Georgia,serif", marginBottom:10 }}>Size — How Defined in the Prospectus</div>
            <div style={{ fontSize:12, color:C.dim, lineHeight:1.75 }}>{fund.sizeDefinition}</div>
          </div>
        )}
        {section==="relPrice" && (
          <div>
            <div style={{ fontSize:13, fontWeight:700, color:fund.color, fontFamily:"Georgia,serif", marginBottom:10 }}>Relative Price — How Defined in the Prospectus</div>
            <div style={{ fontSize:12, color:C.dim, lineHeight:1.75 }}>{fund.relativePriceDefinition}</div>
          </div>
        )}
        {section==="profit" && (
          <div>
            <div style={{ fontSize:13, fontWeight:700, color:fund.color, fontFamily:"Georgia,serif", marginBottom:10 }}>Profitability — How Defined in the Prospectus</div>
            <div style={{ fontSize:12, color:C.dim, lineHeight:1.75 }}>{fund.profitabilityDefinition}</div>
          </div>
        )}
        {section==="seclend" && (
          <div>
            <div style={{ fontSize:13, fontWeight:700, color:fund.color, fontFamily:"Georgia,serif", marginBottom:10 }}>Securities Lending</div>
            {lendingRows.map((row,i) => (
              <div key={i} style={{ background:"#0D1320", borderRadius:7, padding:"9px 12px", marginBottom:6 }}>
                <div style={{ fontSize:10, color:C.muted, textTransform:"uppercase", letterSpacing:"0.08em", marginBottom:2 }}>{row.k}</div>
                <div style={{ fontSize:12, color:C.dim, lineHeight:1.6 }}>{row.v}</div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

// ── Doc panel ─────────────────────────────────────────────────────────────────
function FundDocPanel({ fund, docType }) {
  const doc = fund.docs[docType];
  return (
    <div style={{ background:C.panel, border:`1px solid ${fund.color}30`, borderRadius:12, overflow:"hidden" }}>
      <div style={{ padding:"12px 16px", borderBottom:`1px solid ${C.border}`, display:"flex", alignItems:"center", gap:10, background:`${fund.color}08` }}>
        <div style={{ width:9, height:9, borderRadius:"50%", background:fund.color, boxShadow:`0 0 6px ${fund.color}`, flexShrink:0 }} />
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ fontSize:13, fontWeight:700, color:C.white, fontFamily:"Georgia,serif" }}>{fund.name}</div>
          <div style={{ display:"flex", gap:5, marginTop:3, flexWrap:"wrap" }}>
            <Pill color={fund.color} small>{fund.ticker}</Pill>
            <Pill color={fund.vcol} small>{fund.vehicle}</Pill>
          </div>
        </div>
      </div>
      <div style={{ padding:"11px 15px", borderBottom:`1px solid ${C.border}` }}>
        <div style={{ fontSize:11, fontWeight:700, color:C.accentL, marginBottom:3 }}>{doc.title}</div>
        <div style={{ fontSize:11, color:C.dim }}>Filed: {doc.filed}</div>
        {fund.masterFeeder && fund.masterFeeder.startsWith("YES") && docType==="sai" && (
          <div style={{ marginTop:6, padding:"5px 9px", background:`${C.warn}18`, border:`1px solid ${C.warn}40`, borderRadius:5, fontSize:11, color:C.warn }}>⚠️ Two SAI documents: feeder + master fund</div>
        )}
        {fund.masterFeeder && fund.masterFeeder.startsWith("YES") && docType==="annualReport" && (
          <div style={{ marginTop:6, padding:"5px 9px", background:`${C.warn}18`, border:`1px solid ${C.warn}40`, borderRadius:5, fontSize:11, color:C.warn }}>⚠️ Dual financial statements: feeder + master fund</div>
        )}
      </div>
      <div style={{ padding:"11px 15px", borderBottom:`1px solid ${C.border}` }}>
        <div style={{ fontSize:10, color:C.muted, textTransform:"uppercase", letterSpacing:"0.1em", marginBottom:8 }}>Document Sections</div>
        <AccordionList items={doc.sections} accentColor={fund.color} />
      </div>
      <div style={{ padding:"11px 15px" }}>
        <div style={{ fontSize:10, color:C.muted, textTransform:"uppercase", letterSpacing:"0.1em", marginBottom:5 }}>Key Differences vs Other Funds</div>
        <div style={{ fontSize:12, color:C.dim, lineHeight:1.7, padding:"9px 12px", background:`${fund.color}08`, borderLeft:`3px solid ${fund.color}50`, borderRadius:"0 6px 6px 0" }}>{doc.keyDiff}</div>
      </div>
    </div>
  );
}

// ── Structural table ───────────────────────────────────────────────────────────
function StructureTable() {
  const rows = [
    { dim:"Legal Entity", dfusx:"DFAIDG/DIG (MD Corp)", dfalx:"DFAIDG (MD Corp)", dfemx:"DIG / DFAITC (MD+DE)", dfus:"ETF Trust (DE Trust)", dfai:"ETF Trust (DE Trust)", dfae:"ETF Trust (DE Trust)" },
    { dim:"Investment Objective", dfusx:"Approximate S&P 500 total return", dfalx:"Long-term capital appreciation", dfemx:"Long-term capital appreciation", dfus:"Capital appreciation + minimize taxes", dfai:"Long-term capital appreciation", dfae:"Long-term capital appreciation" },
    { dim:"Master-Feeder", dfusx:"No", dfalx:"No", dfemx:"YES — feeds into DFAITC", dfus:"No", dfai:"No", dfae:"No" },
    { dim:"Factor Tilts", dfusx:"None — index replication", dfalx:"Modest (value, profit)", dfemx:"Modest (value, profit)", dfus:"Modest (constrained by tax mgmt)", dfai:"Modest (size, value, profit)", dfae:"Modest (size, value, profit)" },
    { dim:"Size Universe", dfusx:"S&P 500 (US large cap)", dfalx:"Intl Universe (by country)", dfemx:"EM country-by-country", dfus:"US Universe (all cap)", dfai:"Intl Universe (all cap)", dfae:"EM Universe (~25 countries)" },
    { dim:"Relative Price Def.", dfusx:"P/B (no active tilt)", dfalx:"Low P/B = value", dfemx:"Low P/B per country", dfus:"Low P/B (light tilt)", dfai:"Low P/B per Approved Market", dfae:"Low P/B per EM market" },
    { dim:"Profitability Def.", dfusx:"Earnings/book (no tilt)", dfalx:"Op. earnings/book or assets", dfemx:"Op. earnings/book or assets", dfus:"Op. earnings/book (light tilt)", dfai:"Op. earnings/book per market", dfae:"Op. earnings/book per EM market" },
    { dim:"Sec Lending Auth.", dfusx:"Yes", dfalx:"Yes", dfemx:"Yes (at master level)", dfus:"Yes (tax interaction)", dfai:"Yes", dfae:"Yes (some EM restrictions)" },
    { dim:"Sec Lending Revenue", dfusx:"Modest (US large cap)", dfalx:"Moderate (intl demand)", dfemx:"High (EM — master level)", dfus:"Modest (tax tradeoff)", dfai:"Moderate-high (intl)", dfae:"Highest expected (EM direct)" },
    { dim:"Sec Lending Disclosure", dfusx:"1 annual report", dfalx:"1 annual report", dfemx:"Master fund report only", dfus:"1 annual report (+ tax note)", dfai:"1 annual report", dfae:"1 annual report (cash sub note)" },
    { dim:"SAI Documents", dfusx:"1", dfalx:"1", dfemx:"2 (feeder + master)", dfus:"1", dfai:"1", dfae:"1" },
    { dim:"Holdings Disclosure", dfusx:"Quarterly (30-day lag)", dfalx:"Quarterly (30-day lag)", dfemx:"Quarterly (+ master layer)", dfus:"DAILY", dfai:"DAILY", dfae:"DAILY" },
    { dim:"Expense Ratio", dfusx:"0.08%", dfalx:"0.17%", dfemx:"0.45%", dfus:"0.09%", dfai:"0.18%", dfae:"0.35-0.36%" },
  ];
  const funds = [
    { key:"dfusx", label:"DFUSX", color:C.us, vcol:C.mf },
    { key:"dfalx", label:"DFALX", color:C.dev, vcol:C.mf },
    { key:"dfemx", label:"DFEMX", color:C.em, vcol:C.mf },
    { key:"dfus",  label:"DFUS",  color:C.us, vcol:C.etf },
    { key:"dfai",  label:"DFAI",  color:C.dev, vcol:C.etf },
    { key:"dfae",  label:"DFAE",  color:C.em, vcol:C.etf },
  ];
  const hl = (v) => {
    if(v==="No"||v==="None — index replication"||v==="1"||v.includes("30-day")) return C.muted;
    if(v.startsWith("YES")||v==="DAILY"||v==="High (EM — master level)"||v==="Highest expected (EM direct)") return C.warn;
    if(v.includes("capital appreciation + minimize")||v.includes("tax interaction")||v.includes("tax tradeoff")||v.includes("tax note")) return C.etf;
    if(v.includes("Moderate")||v.includes("Yes")) return C.green;
    return C.dim;
  };
  return (
    <div style={{ overflowX:"auto" }}>
      <table style={{ width:"100%", borderCollapse:"collapse", fontSize:11 }}>
        <thead>
          <tr style={{ borderBottom:`2px solid ${C.border}` }}>
            <th style={{ textAlign:"left", padding:"8px 12px", color:C.muted, fontWeight:600, fontSize:10, textTransform:"uppercase", letterSpacing:"0.08em", minWidth:140, background:C.panelDark }}>Dimension</th>
            {funds.map(f => (
              <th key={f.key} style={{ padding:"8px 10px", background:C.panelDark, minWidth:110 }}>
                <div style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:3 }}>
                  <span style={{ fontSize:13, fontWeight:700, color:f.color }}>{f.label}</span>
                  <Pill color={f.vcol} small>{f.vcol===C.mf?"MF":"ETF"}</Pill>
                </div>
              </th>
            ))}
          </tr>
        </thead>
        <tbody>
          {rows.map((row,i) => (
            <tr key={i} style={{ borderBottom:`1px solid ${C.border}`, background:i%2===0?C.panel:C.panelDark }}>
              <td style={{ padding:"8px 12px", color:C.text, fontWeight:600, fontSize:11 }}>{row.dim}</td>
              {funds.map(f => (
                <td key={f.key} style={{ padding:"8px 10px", textAlign:"center" }}>
                  <span style={{ fontSize:11, color:hl(row[f.key]), lineHeight:1.4, display:"block" }}>{row[f.key]}</span>
                </td>
              ))}
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

// ── MAIN APP ──────────────────────────────────────────────────────────────────
function App() {
  const [view, setView] = useState("profile");
  const [docType, setDocType] = useState("prospectus");
  const [selFund, setSelFund] = useState("dfusx");
  const [selDoc, setSelDoc] = useState("prospectus");

  const markets = ["US Equity","Developed Intl","Emerging Markets"];

  return (
    <div style={{ background:C.bg, minHeight:"100vh", fontFamily:"'Helvetica Neue',Helvetica,Arial,sans-serif", color:C.text, paddingBottom:60 }}>
      {/* Header */}
      <div style={{ background:"linear-gradient(135deg,#0B1628 0%,#111827 100%)", borderBottom:`1px solid ${C.border}`, padding:"20px 20px 14px" }}>
        <div style={{ fontSize:10, color:C.accent, fontFamily:"monospace", letterSpacing:"0.15em", textTransform:"uppercase", marginBottom:4 }}>Fund Document Analysis</div>
        <h1 style={{ fontSize:20, fontWeight:800, color:C.white, fontFamily:"Georgia,serif", margin:0, marginBottom:3 }}>DFA Fund Document Comparison</h1>
        <p style={{ fontSize:12, color:C.muted, margin:0 }}>Prospectus · SAI · Annual Report · Investment Objectives · Factor Definitions · Securities Lending</p>
      </div>

      {/* Legend */}
      <div style={{ padding:"10px 20px", background:C.panel, borderBottom:`1px solid ${C.border}`, display:"flex", gap:12, flexWrap:"wrap", alignItems:"center" }}>
        <Pill color={C.us}>US Equity</Pill>
        <Pill color={C.dev}>Developed Intl</Pill>
        <Pill color={C.em}>Emerging Markets</Pill>
        <span style={{ color:C.border }}>|</span>
        <Pill color={C.mf}>Mutual Fund</Pill>
        <Pill color={C.etf}>ETF</Pill>
      </div>

      {/* View selector */}
      <div style={{ padding:"12px 20px", borderBottom:`1px solid ${C.border}`, display:"flex", gap:8, flexWrap:"wrap" }}>
        <DimBtn label="📌 Fund Profiles" active={view==="profile"} color={C.accent} onClick={() => setView("profile")} />
        <DimBtn label="📄 Side-by-Side Docs" active={view==="compare"} color={C.accent} onClick={() => setView("compare")} />
        <DimBtn label="🔍 Deep Dive" active={view==="fund"} color={C.accent} onClick={() => setView("fund")} />
        <DimBtn label="📊 Comparison Table" active={view==="table"} color={C.accent} onClick={() => setView("table")} />
      </div>

      {/* ── VIEW: Fund Profiles ── */}
      {view==="profile" && (
        <div style={{ padding:"16px 20px" }}>
          <p style={{ fontSize:12, color:C.dim, marginBottom:18, lineHeight:1.6 }}>
            For each fund: the exact investment objective from the prospectus, how size / relative price / profitability are defined in the legal documents, and the full securities lending picture — authorization, expected revenue, collateral, risks, and where it's disclosed.
          </p>
          {markets.map(mkt => {
            const mf = FUNDS.find(f => f.market===mkt && f.vehicle==="Mutual Fund");
            const etf = FUNDS.find(f => f.market===mkt && f.vehicle==="ETF");
            const mc = mkt==="US Equity"?C.us:mkt==="Developed Intl"?C.dev:C.em;
            return (
              <div key={mkt} style={{ marginBottom:28 }}>
                <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:14 }}>
                  <div style={{ width:3, height:22, background:mc, borderRadius:2 }} />
                  <span style={{ fontSize:15, fontWeight:700, color:mc, fontFamily:"Georgia,serif" }}>{mkt}</span>
                </div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:14 }}>
                  <FundProfile fund={mf} />
                  <FundProfile fund={etf} />
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* ── VIEW: Side-by-side docs ── */}
      {view==="compare" && (
        <div style={{ padding:"16px 20px" }}>
          <div style={{ marginBottom:14 }}>
            <div style={{ fontSize:11, color:C.muted, textTransform:"uppercase", letterSpacing:"0.1em", marginBottom:8 }}>Select Document Type</div>
            <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
              {DOC_TYPES.map(dt => (
                <DimBtn key={dt} label={`${DOC_ICONS[dt]} ${DOC_LABELS[dt]}`} active={docType===dt} color={C.accent} onClick={() => setDocType(dt)} />
              ))}
            </div>
          </div>
          <p style={{ fontSize:12, color:C.dim, marginBottom:18, lineHeight:1.6 }}>Showing the <strong style={{ color:C.white }}>{DOC_LABELS[docType]}</strong> across all six funds — mutual fund vs ETF for each market.</p>
          {markets.map(mkt => {
            const mf = FUNDS.find(f => f.market===mkt && f.vehicle==="Mutual Fund");
            const etf = FUNDS.find(f => f.market===mkt && f.vehicle==="ETF");
            const mc = mkt==="US Equity"?C.us:mkt==="Developed Intl"?C.dev:C.em;
            return (
              <div key={mkt} style={{ marginBottom:28 }}>
                <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:12 }}>
                  <div style={{ width:3, height:22, background:mc, borderRadius:2 }} />
                  <span style={{ fontSize:14, fontWeight:700, color:mc, fontFamily:"Georgia,serif" }}>{mkt}</span>
                </div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:14 }}>
                  <FundDocPanel fund={mf} docType={docType} />
                  <FundDocPanel fund={etf} docType={docType} />
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* ── VIEW: Deep Dive ── */}
      {view==="fund" && (
        <div style={{ padding:"16px 20px" }}>
          <div style={{ marginBottom:16 }}>
            <div style={{ fontSize:11, color:C.muted, textTransform:"uppercase", letterSpacing:"0.1em", marginBottom:8 }}>Select Fund</div>
            <div style={{ display:"flex", gap:7, flexWrap:"wrap" }}>
              {FUNDS.map(f => (
                <button key={f.id} onClick={() => setSelFund(f.id)} style={{ background:selFund===f.id?`${f.color}20`:"transparent", border:`1px solid ${selFund===f.id?f.color:C.border}`, borderRadius:20, padding:"6px 14px", fontSize:12, fontWeight:selFund===f.id?700:400, color:selFund===f.id?f.color:C.muted, cursor:"pointer", display:"flex", alignItems:"center", gap:5 }}>
                  {f.ticker} <span style={{ fontSize:10, opacity:0.7 }}>{f.vehicle==="ETF"?"ETF":"MF"}</span>
                </button>
              ))}
            </div>
          </div>
          {(() => {
            const fund = FUNDS.find(f => f.id===selFund);
            return (
              <div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr", gap:14, marginBottom:16 }}>
                  <FundProfile fund={fund} />
                </div>
                <div style={{ fontSize:11, color:C.muted, textTransform:"uppercase", letterSpacing:"0.1em", marginBottom:8 }}>Document Detail</div>
                <div style={{ display:"flex", gap:8, marginBottom:14 }}>
                  {DOC_TYPES.map(dt => (
                    <button key={dt} onClick={() => setSelDoc(dt)} style={{ flex:1, background:selDoc===dt?`${fund.color}20`:"transparent", border:`1px solid ${selDoc===dt?fund.color:C.border}`, borderRadius:8, padding:"10px 8px", fontSize:12, fontWeight:selDoc===dt?700:400, color:selDoc===dt?C.white:C.muted, cursor:"pointer", textAlign:"center" }}>
                      {DOC_ICONS[dt]} {DOC_LABELS[dt]}
                    </button>
                  ))}
                </div>
                <FundDocPanel fund={fund} docType={selDoc} />
              </div>
            );
          })()}
        </div>
      )}

      {/* ── VIEW: Comparison Table ── */}
      {view==="table" && (
        <div style={{ padding:"16px 20px" }}>
          <p style={{ fontSize:12, color:C.dim, marginBottom:18, lineHeight:1.6 }}>
            Cross-fund comparison of objectives, factor definitions, securities lending, and structural differences. <span style={{ color:C.green }}>Green</span> = feature present. <span style={{ color:C.warn }}>Orange</span> = high complexity or notable characteristic.
          </p>
          <StructureTable />
          <div style={{ marginTop:20, display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:12 }}>
            {[
              { title:"Investment Objective Differences", color:C.accentL, points:["DFUSX only: benchmark-replication ('approximate total return of S&P 500') — not 'long-term capital appreciation'","DFUS only: dual objective — capital appreciation AND explicit tax minimization","DFEMX only: master-feeder structure stated IN the objective ('pursues its objective by investing in its Master Fund')","DFAI, DFALX, DFAE, DFEMX: standard 'long-term capital appreciation' language","No fund targets 'income' as a primary objective — all are capital appreciation focused"] },
              { title:"Factor Definition Consistency", color:C.em, points:["ALL six funds use identical relative price definition: 'low price in relation to book value' with possible adjustments for P/CF or P/E","ALL six funds use identical profitability definition: 'high earnings or profits from operations in relation to book value or assets'","Size definition varies: US funds use US Universe, developed intl use country-specific International Universe, EM funds use per-country EM thresholds","DFUSX has NO active factor tilts — holds S&P 500 at index weights","Criteria for relative price and profitability are explicitly stated as 'subject to change from time to time' in all six prospectuses"] },
              { title:"Securities Lending Cross-Fund", color:C.dev, points:["All six funds authorized to lend — language is standard across prospectuses","DFEMX: lending at MASTER FUND level — feeder annual report shows no lending detail; must read DFAITC N-CSR","DFUS: lending income is ordinary income, partially offsetting the tax management objective — unique tension","DFAE: some EM markets restrict lending — cash substitution in ETF baskets interacts with lending program","Revenue gradient: DFUSX (lowest) < DFUS < DFALX ≈ DFAI < DFEMX ≈ DFAE (highest) as % of NAV","All funds: DFA LP explicitly does not act as securities lending agent (per Form ADV)"] },
            ].map(card => (
              <div key={card.title} style={{ background:C.panel, border:`1px solid ${card.color}30`, borderRadius:10, padding:16 }}>
                <div style={{ fontSize:12, fontWeight:700, color:card.color, marginBottom:12, lineHeight:1.4, fontFamily:"Georgia,serif" }}>{card.title}</div>
                <ul style={{ listStyle:"none", display:"flex", flexDirection:"column", gap:6 }}>
                  {card.points.map((p,i) => (
                    <li key={i} style={{ fontSize:11, color:C.dim, lineHeight:1.5, display:"flex", gap:6 }}>
                      <span style={{ color:card.color, flexShrink:0, marginTop:1 }}>›</span>{p}
                    </li>
                  ))}
                </ul>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Footer */}
      <div style={{ margin:"20px 20px 0", padding:"10px 14px", background:C.panel, border:`1px solid ${C.border}`, borderRadius:8, fontSize:11, color:C.muted, lineHeight:1.6 }}>
        Sources: SEC EDGAR (Form 497K, 485BPOS, N-CSR); DFA Prospectuses dated Feb 28, 2024 and Feb 28, 2025; Dimensional ETF Trust Prospectus Feb 28, 2025; DFA Form ADV Part 2A (March 2025); Federal Register Oct 2025; Rule 6c-11 (ETF Rule). Investment objective text quoted directly from SEC filings.
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
